<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Laba Rugi - PT Prima Akuntindo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="report-page-container">
        <div class="nav-back-bar">
            <a href="dashboard.html" class="nav-back-link">&larr; Kembali ke Dashboard</a>
        </div>
        <div class="card-report">
            <header class="report-header">
                <h2>PT PRIMA AKUNTINDO</h2>
                <h3>LAPORAN LABA RUGI</h3>
                <p>Per 31 Oktober 2026</p>
            </header>
            <div class="table-responsive">
                <table class="report-table">
                    <thead>
                        <tr>
                            <th class="col-code">Kode</th>
                            <th>Keterangan Akun</th>
                            <th class="col-amount">Nominal (Rp)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="col-code">4101</td>
                            <td>Pendapatan Jasa</td>
                            <td class="col-amount">120.000.000</td>
                        </tr>
                        <tr>
                            <td class="col-code">5101</td>
                            <td>Beban Gaji Karyawan</td>
                            <td class="col-amount">30.000.000</td>
                        </tr>
                        <tr>
                            <td class="col-code">5102</td>
                            <td>Beban Sewa Gedung</td>
                            <td class="col-amount">10.000.000</td>
                        </tr>
                        <tr>
                            <td class="col-code">5103</td>
                            <td>Beban Perlengkapan</td>
                            <td class="col-amount">2.500.000</td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="2" class="total-label">TOTAL LABA BERSIH</td>
                            <td class="total-amount">77.500.000</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
