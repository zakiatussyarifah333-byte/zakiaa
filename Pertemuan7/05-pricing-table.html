<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>05 - Pricing Table - Sebelum</title>

    <style>
       
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        
        .pricing-container {
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            padding: 50px;
            background-color: #f9f9f9; 
        }

       
        .plan {
            background-color: white; 
            border: 1px solid #ddd; 
            border-radius: 10px;
            padding: 30px;
            text-align: center; 
            width: 250px; 
            transition: transform 0.3s; 
        }

        .plan h3 {
            margin-bottom: 15px;
        }

        .plan h2 {
            margin-bottom: 20px;
        }

        .plan ul {
            list-style-type: none; 
            margin-bottom: 20px;
        }

        .plan ul li {
            margin-bottom: 10px; 
        }

        .plan button {
            padding: 10px 20px;
            border: none;
            background-color: #007bff; 
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .plan button:hover {
            background-color: #0056b3; 
        }

        
        .popular {
            transform: scale(1.05); 
            border-color: #ffcc00; 
        }
    </style>
</head>
<body>
    <!-- 
    INSTRUKSI PENGERJAAN:
    1. Gunakan CSS Grid atau Flexbox pada ".pricing-container" untuk menyejajarkan 3 paket secara horizontal.
    2. Berikan gaya dasar pada setiap kartu ".plan" (border, padding, border-radius, background putih, text-align center).
    3. Khusus untuk paket tengah (berikan class .popular), ubah ukuran agar sedikit lebih menonjol (transform: scale(1.05) atau padding lebih besar).
    4. Ubah warna border/header pada paket popular untuk membedakannya.
    5. Hilangkan bullet pada daftar fitur (ul) dan berikan jarak.
    -->
    <div class="pricing-container">
        <div class="plan">
            <h3>Basic</h3>
            <h2>Gratis</h2>
            <ul>
                <li>1 Pengguna</li>
                <li>Penyimpanan 1GB</li>
                <li>Dukungan Komunitas</li>
            </ul>
            <button>Pilih Basic</button>
        </div>
        <div class="plan popular">
            <h3>Pro (Populer)</h3>
            <h2>Rp 100.000/bln</h2>
            <ul>
                <li>5 Pengguna</li>
                <li>Penyimpanan 50GB</li>
                <li>Dukungan Prioritas</li>
            </ul>
            <button>Pilih Pro</button>
        </div>
        <div class="plan">
            <h3>Enterprise</h3>
            <h2>Hubungi Kami</h2>
            <ul>
                <li>Pengguna Tak Terbatas</li>
                <li>Penyimpanan Unlimited</li>
                <li>Dukungan 24/7</li>
            </ul>
            <button>Pilih Enterprise</button>
        </div>
    </div>
</body>
</html>
